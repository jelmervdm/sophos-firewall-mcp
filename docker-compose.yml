version: '3.8'

services:
  sophos-firewall-mcp:
    build: .
    image: sophos-firewall-mcp:latest
    container_name: sophos-firewall-mcp
    environment:
      - SOPHOS_HOST=${SOPHOS_HOST:-192.168.1.1}
      - SOPHOS_PORT=${SOPHOS_PORT:-4444}
      - SOPHOS_USERNAME=${SOPHOS_USERNAME:-admin}
      - SOPHOS_PASSWORD=${SOPHOS_PASSWORD}
      - SOPHOS_API_VERSION=${SOPHOS_API_VERSION:-2200.1}
      - SOPHOS_VERIFY_SSL=${SOPHOS_VERIFY_SSL:-false}
      - SOPHOS_TIMEOUT=${SOPHOS_TIMEOUT:-30}
      - USE_ROUTER=${USE_ROUTER:-false}
    restart: unless-stopped
    stdin_open: true
    tty: true
